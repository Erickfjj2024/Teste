# The crusher, the enrichment chamber and the energized smelter run on recipes from the mod's data
# and the game's cooking recipes, with energy from a creative cube, and show when they work.

items = ["minecraft:iron_ore", "minecraft:iron_ingot", "mekanism:dust_iron", "mekanism:enriched_iron", "minecraft:stone", "minecraft:oak_log", "minecraft:oak_planks", "mekanism:sawdust", "minecraft:flint", "minecraft:cobblestone", "minecraft:gravel", "minecraft:copper_ingot", "minecraft:redstone", "mekanism:alloy_infused"]

[[recipe]]
id = "mekanism:crushing/iron"
json = '''{"type":"mekanism:crushing","input":{"count":1,"ingredient":"minecraft:iron_ingot"},"output":{"count":1,"id":"mekanism:dust_iron"}}'''

[[recipe]]
id = "mekanism:enriching/iron"
json = '''{"type":"mekanism:enriching","input":{"count":1,"ingredient":"mekanism:dust_iron"},"output":{"count":1,"id":"mekanism:enriched_iron"}}'''

[[recipe]]
id = "mekanism:sawing/oak"
json = '''{"type":"mekanism:sawing","input":{"count":1,"ingredient":"minecraft:oak_log"},"main_output":{"count":6,"id":"minecraft:oak_planks"},"secondary_chance":1.0,"secondary_output":{"id":"mekanism:sawdust"}}'''

[[recipe]]
id = "mekanism:combining/gravel"
json = '''{"type":"mekanism:combining","main_input":{"count":1,"ingredient":"minecraft:flint"},"extra_input":{"count":1,"ingredient":"minecraft:cobblestone"},"output":{"id":"minecraft:gravel"}}'''

[[recipe]]
id = "mekanism:metallurgic_infusing/alloy/infused"
json = '''{"type":"mekanism:metallurgic_infusing","chemical_input":{"amount":10,"ingredient":"#mekanism:redstone"},"experience":0.2,"item_input":{"count":1,"ingredient":"minecraft:copper_ingot"},"output":{"id":"mekanism:alloy_infused"},"per_tick_usage":false}'''

[[recipe]]
id = "mekanism:chemical_conversion/redstone/from_dust"
json = '''{"type":"mekanism:chemical_conversion","group":"mekanism:redstone","input":{"count":1,"ingredient":"minecraft:redstone"},"output":{"amount":10,"id":"mekanism:redstone"}}'''

[[cooking]]
inputs = ["minecraft:iron_ore"]
output = "minecraft:iron_ingot"

[[step]]
join = "Alex"
# The cube faces north: its front outputs (Mekanism's default), its other sides only take.
blocks = [
    { x = 0, y = 64, z = 0, state = "mekanism:creative_energy_cube" },
    { x = 0, y = 64, z = -1, state = "mekanism:crusher[facing=north,lit=false]" },
    { x = 3, y = 64, z = 0, state = "mekanism:energized_smelter[facing=north,lit=false]" },
]
set-items = [
    { x = 0, y = 64, z = -1, slots = ["minecraft:iron_ingot*2", ""] },
    { x = 3, y = 64, z = 0, slots = ["minecraft:iron_ore*1", ""] },
]
ticks = 1
# One tick in: the cube fills itself and feeds the crusher in front of it.
expect.block-items = [{ x = 0, y = 64, z = -1, slots = ["minecraft:iron_ingot*2", ""] }]

[[step]]
ticks = 220
# 200 ticks later, the first ingot is a dust; the smelter, with no cable to the cube, never started.
expect.block-items = [
    { x = 0, y = 64, z = -1, slots = ["minecraft:iron_ingot*1", "mekanism:dust_iron*1"] },
    { x = 3, y = 64, z = 0, slots = ["minecraft:iron_ore*1", ""] },
]
expect.blocks = [{ x = 0, y = 64, z = -1, state = "mekanism:crusher[facing=north,lit=true]" }]

[[step]]
# Two cables beside the cube: its east side only takes energy, so the smelter gets none.
blocks = [
    { x = 1, y = 64, z = 0, state = "mekanism:basic_universal_cable" },
    { x = 2, y = 64, z = 0, state = "mekanism:basic_universal_cable" },
]
ticks = 205
expect.block-items = [{ x = 3, y = 64, z = 0, slots = ["minecraft:iron_ore*1", ""] }]
expect.blocks = [{ x = 0, y = 64, z = 0, state = "mekanism:creative_energy_cube" }]

[[step]]
# As the original's configurator does: sneaking in the air goes to the next mode (items, fluids, chemicals, energy, heat),
# items to start with; a plain click on a side only tells what it is; sneaking, the click bumps the side to the next type.
as = "Alex"
motion = { sneaking = true }
use-item = { stack = "mekanism:configurator*1" }
ticks = 1
expect.claimed = true
expect.told = ["Alex: Configure State: Configurate (Fluids)"]

[[step]]
as = "Alex"
use-item = { stack = "mekanism:configurator*1" }
ticks = 1
expect.told = ["Alex: Configure State: Configurate (Chemicals)"]

[[step]]
as = "Alex"
use-item = { stack = "mekanism:configurator*1" }
ticks = 1
expect.told = ["Alex: Configure State: Configurate (Energy)"]

[[step]]
# The player looks west at the cube's east face from beside it (sneaking) and uses the configurator on it: that side,
# an input, becomes an output, and the cables feed the smelter.
as = "Alex"
player = { x = 1.5, y = 62.88, z = 0.5, yaw = 90.0, pitch = 0.0 }
use-item = { stack = "mekanism:configurator*1", pos = [0, 64, 0] }
ticks = 1
expect.claimed = true

[[step]]
ticks = 205
expect.told = ["Alex: Energy behavior bumped to: Output (Blue)"]
expect.blocks = [{ x = 0, y = 64, z = 0, state = "mekanism:creative_energy_cube" }]
expect.block-items = [{ x = 3, y = 64, z = 0, slots = ["", "minecraft:iron_ingot*1"] }]

[[step]]
# Not sneaking, a click only tells the side's behaviour and changes nothing.
as = "Alex"
motion = { sneaking = false }
use-item = { stack = "mekanism:configurator*1", pos = [0, 64, 0] }
ticks = 1
expect.claimed = true

[[step]]
ticks = 2
expect.told = ["Alex: Current Energy behavior: Output (Blue)"]

[[step]]
# A new combiner has Mekanism's default side configuration (items: input at the front, left, top, right output, charge slot
# at the back, extra input at the bottom; energy in everywhere), shown to its screen as nibbles in data slots 6 to 9.
blocks = [{ x = 30, y = 64, z = 0, state = "mekanism:combiner[facing=north,lit=false]" }]
ticks = 2
expect.block-menu-data = [{ x = 30, y = 64, z = 0, data = [0, 0, 0, 12500, 0, 0, 33809, 145, 4369, 17, 0, 0, 0, 0, 0, 0] }]

[[step]]
# A press on the bottom side's button (id 1050) takes it from extra to the next type, none; the eject toggle (2000) turns
# eject on.
as = "Alex"
press = { x = 30, y = 64, z = 0, id = 1050 }
ticks = 1
expect.block-menu-data = [{ x = 30, y = 64, z = 0, data = [0, 0, 0, 12500, 0, 0, 33809, 1, 4369, 17, 0, 0, 0, 0, 0, 0] }]

[[step]]
as = "Alex"
press = { x = 30, y = 64, z = 0, id = 2000 }
ticks = 1
expect.block-menu-data = [{ x = 30, y = 64, z = 0, data = [0, 0, 0, 12500, 0, 0, 33809, 257, 4369, 17, 0, 0, 0, 0, 0, 0] }]

[[step]]
# The energy clear button (3010): every side the same, so the next type (none); the items clear button (3000): mixed
# sides go to none.
as = "Alex"
press = { x = 30, y = 64, z = 0, id = 3010 }
ticks = 1
expect.block-menu-data = [{ x = 30, y = 64, z = 0, data = [0, 0, 0, 12500, 0, 0, 33809, 257, 0, 0, 0, 0, 0, 0, 0, 0] }]

[[step]]
as = "Alex"
press = { x = 30, y = 64, z = 0, id = 3000 }
ticks = 1
expect.block-menu-data = [{ x = 30, y = 64, z = 0, data = [0, 0, 0, 12500, 0, 0, 0, 256, 0, 0, 0, 0, 0, 0, 0, 0] }]

[[step]]
# The use in the air that comes with a click on a machine (the client sends both) must not change the tool's mode:
# sneaking, a click on the cube is followed at once by one in the air, and the tool stays on energy.
as = "Alex"
motion = { sneaking = true }
use-item = { stack = "mekanism:configurator*1", pos = [0, 64, 0] }
ticks = 1
expect.claimed = true

[[step]]
as = "Alex"
use-item = { stack = "mekanism:configurator*1" }
ticks = 1
expect.claimed = true
expect.told = ["Alex: Energy behavior bumped to: Input/Output (Purple)"]

[[step]]
# A while later, sneaking in the air does change the mode (energy to heat), as before.
as = "Alex"
ticks = 10
use-item = { stack = "mekanism:configurator*1" }
expect.told = ["Alex: Configure State: Configurate (Heat)"]

[[step]]
# The energy cube's screen: a basic cube far from the rest, a redstone dust in its discharge slot turns into 10000 energy
# (the recipe of energy_conversion) one a tick, the stack shrinking by one each.
blocks = [{ x = 60, y = 64, z = 0, state = "mekanism:basic_energy_cube" }]
set-items = [{ x = 60, y = 64, z = 0, slots = ["minecraft:redstone*3", ""] }]
ticks = 1
expect.block-items = [{ x = 60, y = 64, z = 0, slots = ["minecraft:redstone*2", ""] }]

[[step]]
# A press on the window's button for the cube's left side (1000 + 1 * 100 + 1 * 10): the cube applies it on its next tick.
as = "Alex"
press = { x = 60, y = 64, z = 0, id = 1110 }
ticks = 2

[[step]]
# The metallurgic infuser: the redstone in its infusion slot turns into infusion type in its tank, ten for each dust
# (the recipes of chemical_conversion), one dust a tick, up to a bucket. Its recipes come a little after the start.
blocks = [
    { x = 80, y = 64, z = 0, state = "mekanism:creative_energy_cube" },
    { x = 80, y = 64, z = -1, state = "mekanism:metallurgic_infuser[facing=north,lit=false]" },
]
set-items = [{ x = 80, y = 64, z = -1, slots = ["", "", "minecraft:redstone*3"] }]
ticks = 25
expect.block-items = [{ x = 80, y = 64, z = -1, slots = ["", "", ""] }]
expect.block-tanks = [{ x = 80, y = 64, z = -1, tanks = ["mekanism:redstone*30"] }]

[[step]]
# 200 ticks after a copper ingot is put in, it and ten of the infusion type have made an infused alloy (the recipe of
# metallurgic_infusing), and the tank keeps what is left.
set-items = [{ x = 80, y = 64, z = -1, slots = ["minecraft:copper_ingot*2", "", ""] }]
ticks = 205
expect.block-items = [{ x = 80, y = 64, z = -1, slots = ["minecraft:copper_ingot*1", "mekanism:alloy_infused*1", ""] }]
expect.block-tanks = [{ x = 80, y = 64, z = -1, tanks = ["mekanism:redstone*20"] }]

[[step]]
# The dump button (4000) empties the tank.
as = "Alex"
press = { x = 80, y = 64, z = -1, id = 4000 }
ticks = 1
expect.block-tanks = [{ x = 80, y = 64, z = -1, tanks = [""] }]
