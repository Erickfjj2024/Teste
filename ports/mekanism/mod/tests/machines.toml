# --- The configurator's other modes (Alex's tool is on heat from the steps above) ---

[[step]]
# The crusher does not configure heat: the click is not claimed, so it falls through to the block (a plain click opens
# its screen, as in the original) instead of vanishing into the tool. A fresh crusher holds two ingots for the empty
# test below.
blocks = [{ x = 500, y = 64, z = 0, state = "mekanism:crusher[facing=north,lit=false]" }]
set-items = [{ x = 500, y = 64, z = 0, slots = ["minecraft:iron_ingot*2", "", "", ""] }]
ticks = 1
expect.block-items = [{ x = 500, y = 64, z = 0, slots = ["minecraft:iron_ingot*2", "", "", ""] }]

[[step]]
as = "Alex"
motion = { sneaking = true }
player = { x = 501.5, y = 62.88, z = 0.5, yaw = 90.0, pitch = 0.0 }
use-item = { stack = "mekanism:configurator*1", pos = [500, 64, 0] }
ticks = 1
expect.claimed = false

[[step]]
# Heat goes to empty.
as = "Alex"
motion = { sneaking = true }
use-item = { stack = "mekanism:configurator*1" }
ticks = 1
expect.claimed = true
expect.told = ["Alex: Configure State: Empty"]

[[step]]
# Empty drops every non-empty item slot into the world and leaves the rest alone: each stack is summoned as a
# `minecraft:item` at the block, and the slots are only cleared once the game says the drop exists (the old extra
# slots trick destroyed the items instead: the game truncates them).
as = "Alex"
motion = { sneaking = false }
player = { x = 501.5, y = 62.88, z = 0.5, yaw = 90.0, pitch = 0.0 }
use-item = { stack = "mekanism:configurator*1", pos = [500, 64, 0] }
ticks = 1
expect.claimed = true

[[step]]
# The click is taken up on this tick: one summon for the crusher's two ingots (the first summon of the run, so
# ticket 1), and the slots are still full — they only empty once the drop is confirmed, in the steps below.
ticks = 2
expect.entity-commands = ["summon minecraft:item 500.5 64.5 0.5 #1 {Item:{id:\"minecraft:iron_ingot\",Count:2b}}"]

[[step]]
# The game answers the ticket: the drop exists.
spawned = { ticket = 1, id = 77 }
ticks = 1

[[step]]
# Now the slots empty; a drop the game had refused would have stayed in the machine instead.
ticks = 1
expect.block-items = [{ x = 500, y = 64, z = 0, slots = ["", "", "", ""] }]

[[step]]
# Empty goes to rotate.
as = "Alex"
motion = { sneaking = true }
use-item = { stack = "mekanism:configurator*1" }
ticks = 1
expect.claimed = true
expect.told = ["Alex: Configure State: Rotate"]

[[step]]
# Rotate turns the crusher to the face clicked (east, from beside it).
as = "Alex"
motion = { sneaking = false }
player = { x = 501.5, y = 62.88, z = 0.5, yaw = 90.0, pitch = 0.0 }
use-item = { stack = "mekanism:configurator*1", pos = [500, 64, 0] }
ticks = 1
expect.claimed = true

[[step]]
ticks = 2
expect.blocks = [{ x = 500, y = 64, z = 0, state = "mekanism:crusher[facing=east,lit=false]" }]

[[step]]
# Sneaking, rotate turns it to the opposite face instead (west).
